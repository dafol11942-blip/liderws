; Отключение вывода ошибок в браузер на проде (пункт отчёта сканера безопасности
; Битрикс "Включен расширенный вывод ошибок") — ошибки продолжают писаться в лог,
; просто не показываются посетителю сайта.
;
; Работает только если сайт обслуживается через PHP-FPM/CGI (директивы .user.ini
; игнорируются под mod_php — там то же самое нужно выставить в php.ini/.htaccess
; через AllowOverride Options, либо в панели хостинга). После заливки файла
; изменения подхватываются не мгновенно (см. user_ini.cache_ttl, по умолчанию 300с).
display_errors = Off
log_errors = On
